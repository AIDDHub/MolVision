name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: --linux AppImage
          - os: windows-latest
            target: --win portable
          - os: macos-latest
            target: --mac dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install root dependencies
        run: npm ci
      - name: Install renderer dependencies
        run: npm ci --prefix webapp
      - name: Unit tests
        run: npm test
      - name: Install patched COSMol WASM
        run: bash scripts/install-patched-cosmol.sh
      - name: Verify patched WASM
        run: bash scripts/check-patched-cosmol.sh
      - name: Package
        run: npx electron-builder ${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: molvision-${{ matrix.os }}
          path: release/*
